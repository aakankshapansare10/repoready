[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoready"
version = "0.1.0"
description = "A friendly command-line audit for GitHub project essentials"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RepoReady contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
repoready = "repoready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
